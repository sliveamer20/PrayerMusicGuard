<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صلاة وسكون</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #202024;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    .splash-container {
      text-align: center;
      padding: 40px;
    }
    
    .splash-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    
    .splash-status {
      font-size: 14px;
      color: #b0b0b0;
      margin-bottom: 30px;
    }
    
    /* Loader from Uiverse.io by dylanharriscameron - adapted for dark theme */
    .loaderBar {
      width: calc(160px / 0.707);
      height: 10px;
      background: #2a2a2e;
      border-radius: 10px;
      border: 1px solid #006DFE;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    .loaderBar::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 5px;
      background: repeating-linear-gradient(
        45deg,
        #0031F2 0 30px,
        #006DFE 0 40px
      ) right/200% 100%;
      animation:
        fillProgress 6s ease-in-out infinite,
        lightEffect 1s infinite linear;
      animation-fill-mode: forwards;
    }

    @keyframes fillProgress {
      0% {
        width: 0;
      }
      33% {
        width: 33.333%;
      }
      66% {
        width: 66.67%;
      }
      100% {
        width: 100%;
      }
    }

    @keyframes lightEffect {
      0%, 20%, 40%, 60%, 80%, 100% {
        background:
          repeating-linear-gradient(
            45deg,
            #0031F2 0 30px,
            #006DFE 0 40px
          ) right/200% 100%;
      }
      10%, 30%, 50%, 70%, 90% {
        background:
          repeating-linear-gradient(
            45deg,
            #0031F2 0 30px,
            #006DFE 0 40px,
            rgba(255, 255, 255, 0.3) 0 40px
          ) right/200% 100%;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <h1 class="splash-title">صلاة وسكون</h1>
    <p class="splash-status">جاري التشغيل...</p>
    <div class="loaderBar"></div>
  </div>
</body>
</html>
